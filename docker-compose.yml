version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: house_of_engineers_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - ALERT_RECIPIENT_EMAIL=${ALERT_RECIPIENT_EMAIL:-info@houseofengineers.pk}
      - ALERT_FROM_EMAIL=${ALERT_FROM_EMAIL:-no-reply@houseofengineers.pk}
